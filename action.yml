name: 'Buildalon create unity project from hub template'
branding:
  icon: cloud-lightning
  color: 'red'
description: A GitHub Action to create a new Unity Project from a Unity project template.
inputs:
  project-name:
    description: The name of the Unity project to create.
    required: true
  project-directory:
    description: The directory where the Unity project will be created. Defaults to the root of the workspace.
    required: false
    default: '${{ github.workspace }}'
  template-name:
    description: A comma, newline or | separated list of template id prefixes, in order of preference. The first one the editor offers is used.
    required: false
    default: 'com.unity.template.3d, com.unity.template.urp-blank'
outputs:
  project-path:
    description: The path to the created Unity project.
runs:
  using: node24
  main: dist/index.js